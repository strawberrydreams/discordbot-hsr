<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hyacine 관리자 로그인</title>
  <style>
    :root {
      color-scheme: dark;
      --blurple: #5865f2;
      --blurple-hover: #4752c4;
      --spring-green: #57f287;
      --cosmic: #0e0f2d;
      --cosmic-deep: #090a20;
      --chrome: #23272a;
      --surface: #2c2f33;
      --snow: #ffffff;
      --fog: #babcd9;
      --greyple: #99aab5;
      --dim-grey: #50555f;
      --danger: #ed4245;
      --border: #40444b;
      --radius-button: 12px;
      --radius-card: 16px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans KR", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      place-items: center;
      margin: 0;
      background:
        radial-gradient(circle at 72% -15%, rgba(88, 101, 242, .24), transparent 31rem),
        var(--cosmic-deep);
      color: var(--snow);
      font-size: 15px;
      line-height: 1.5;
      padding: 24px;
    }

    button,
    input { font: inherit; }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(88, 101, 242, .52);
      outline-offset: 2px;
    }

    .login-shell {
      display: grid;
      width: min(100%, 880px);
      grid-template-columns: minmax(0, .9fr) minmax(360px, 1.1fr);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 24px;
      background: var(--chrome);
    }

    .brand-panel {
      display: flex;
      min-height: 500px;
      flex-direction: column;
      justify-content: space-between;
      background: var(--cosmic);
      padding: 40px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 14px;
      background: var(--blurple);
      color: var(--snow);
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .brand-name {
      display: block;
      font-size: 19px;
      font-weight: 850;
      letter-spacing: -.01em;
    }

    .brand-meta {
      display: block;
      color: var(--greyple);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .brand-copy h1 {
      max-width: 320px;
      margin: 0 0 16px;
      font-size: clamp(34px, 5vw, 46px);
      font-weight: 900;
      letter-spacing: -.025em;
      line-height: .98;
      text-transform: uppercase;
    }

    .brand-copy p {
      max-width: 330px;
      margin: 0;
      color: var(--fog);
    }

    .boundary {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--greyple);
      font-size: 12px;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--spring-green);
    }

    .form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(32px, 6vw, 56px);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--greyple);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .form-panel h2 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 850;
      letter-spacing: -.02em;
    }

    .form-copy {
      margin: 0 0 28px;
      color: var(--fog);
    }

    .error {
      border-left: 3px solid var(--danger);
      border-radius: 0 var(--radius-button) var(--radius-button) 0;
      background: rgba(237, 66, 69, .1);
      color: #ffb8ba;
      margin: 0 0 20px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 700;
    }

    .error:empty { display: none; }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--fog);
      font-size: 13px;
      font-weight: 750;
    }

    input {
      display: block;
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--dim-grey);
      border-radius: 10px;
      background: var(--surface);
      color: var(--snow);
      padding: 11px 12px;
      transition: border-color 160ms ease, background-color 160ms ease;
    }

    input:hover { border-color: var(--greyple); }

    input:focus {
      border-color: var(--blurple);
      background: #34373c;
    }

    .helper {
      display: block;
      margin-top: 8px;
      color: var(--greyple);
      font-size: 12px;
    }

    button {
      display: inline-flex;
      width: 100%;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: var(--radius-button);
      background: var(--blurple);
      color: var(--snow);
      margin-top: 24px;
      padding: 0 20px;
      cursor: pointer;
      font-weight: 800;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    button:hover {
      background: var(--blurple-hover);
      transform: translateY(-1px);
    }

    @media (max-width: 720px) {
      body { padding: 16px; }

      .login-shell { grid-template-columns: 1fr; }

      .brand-panel {
        min-height: auto;
        gap: 40px;
        padding: 28px;
      }

      .brand-copy h1 { font-size: 32px; }

      .form-panel { padding: 32px 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="brand-panel" aria-labelledby="brand-heading">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span>
          <span class="brand-name">Hyacine</span>
          <span class="brand-meta">Bot admin</span>
        </span>
      </div>
      <div class="brand-copy">
        <h1 id="brand-heading">Bot Control Center</h1>
        <p>페르소나와 콘텐츠 설정, 길드 운영 현황을 로컬 환경에서 안전하게 관리하세요.</p>
      </div>
      <div class="boundary"><span class="status-dot" aria-hidden="true"></span>127.0.0.1:8080 · Localhost protected</div>
    </section>

    <section class="form-panel" aria-labelledby="login-heading">
      <p class="eyebrow">Administrator access</p>
      <h2 id="login-heading">관리자 로그인</h2>
      <p class="form-copy">환경변수에 설정한 관리 토큰을 입력하세요.</p>
      <p class="error" role="alert" aria-live="assertive">{{error}}</p>
      <form method="post" action="/login">
        <label for="admin-token">관리 토큰</label>
        <input id="admin-token" type="password" name="token" required autocomplete="current-password" autofocus>
        <span class="helper">토큰은 이 로그인 요청 외에는 화면에 표시되지 않습니다.</span>
        <button type="submit">로그인</button>
      </form>
    </section>
  </main>
</body>
</html>
