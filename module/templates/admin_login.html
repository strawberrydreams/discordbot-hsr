<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{bot_name}} 관리자 로그인</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login">
  <main class="login-shell">
    <section class="brand-panel" aria-labelledby="brand-heading">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">{{bot_name_initial}}</span>
        <span>
          <span class="brand-name">{{bot_name}}</span>
          <span class="brand-meta">Bot admin</span>
        </span>
      </div>
      <div class="brand-copy">
        <h1 id="brand-heading">Bot Control Center</h1>
        <p>페르소나와 콘텐츠 설정, 길드 운영 현황을 로컬 환경에서 안전하게 관리하세요.</p>
      </div>
      <div class="boundary"><span class="status-dot" aria-hidden="true"></span>127.0.0.1:8080 · Localhost protected</div>
    </section>

    <section class="form-panel" aria-labelledby="login-heading">
      <p class="eyebrow">Administrator access</p>
      <h2 id="login-heading">관리자 로그인</h2>
      <p class="form-copy">환경변수에 설정한 관리 토큰을 입력하세요.</p>
      <p class="error" role="alert" aria-live="assertive">{{error}}</p>
      <form method="post" action="/login">
        <label for="admin-token">관리 토큰</label>
        <input id="admin-token" type="password" name="token" required autocomplete="current-password" autofocus>
        <span class="helper">토큰은 이 로그인 요청 외에는 화면에 표시되지 않습니다.</span>
        <button type="submit">로그인</button>
      </form>
    </section>
  </main>
</body>
</html>
