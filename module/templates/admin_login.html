<!doctype html>
<html lang="{{t:html_lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{t:login_title}}</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login">
  <main class="login-shell">
    <section class="brand-panel" aria-labelledby="brand-heading">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">{{bot_name_initial}}</span>
        <span>
          <span class="brand-name">{{bot_name}}</span>
          <span class="brand-meta">{{t:brand_meta}}</span>
        </span>
      </div>
      <div class="brand-copy">
        <h1 id="brand-heading">{{t:login_hero_heading}}</h1>
        <p>{{t:login_hero_copy}}</p>
      </div>
      <nav class="language-switch" aria-label="{{t:language_switch_label}}">
        <a href="?lang=ko">{{t:language_korean}}</a>
        <a href="?lang=en">{{t:language_english}}</a>
      </nav>
      <div class="boundary"><span class="status-dot" aria-hidden="true"></span>{{t:localhost_protected}}</div>
    </section>

    <section class="form-panel" aria-labelledby="login-heading">
      <p class="eyebrow">{{t:login_eyebrow}}</p>
      <h2 id="login-heading">{{t:login_heading}}</h2>
      <p class="form-copy">{{t:login_copy}}</p>
      <p class="error" role="alert" aria-live="assertive">{{error}}</p>
      <form method="post" action="/login">
        <label for="admin-token">{{t:login_token_label}}</label>
        <input id="admin-token" type="password" name="token" required autocomplete="current-password" autofocus>
        <span class="helper">{{t:login_token_helper}}</span>
        <button type="submit">{{t:login_submit}}</button>
      </form>
    </section>
  </main>
</body>
</html>
