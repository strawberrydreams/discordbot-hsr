services:
  bot:
    image: discordbot-hsr:local
    build: .
    env_file:
      - .env.runtime
      - .env.secrets
    command: ["python", "-m", "module.main"]
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./runtime/data:/app/runtime/data
      - ./runtime/backups:/app/runtime/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: discordbot-hsr:local
    env_file:
      - .env.runtime
      - .env.secrets
    command: ["python", "-m", "module.backup", "loop"]
    restart: unless-stopped
    volumes:
      # WAL DB는 읽기 전용 연결이라도 -shm/-wal을 만들 수 있어야 하므로 rw로 마운트한다.
      # 백업 코드는 온라인 backup API로 읽기만 한다.
      - ./runtime/data:/app/runtime/data
      - ./runtime/backups:/app/runtime/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
