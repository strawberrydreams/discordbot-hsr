services:
  bot:
    image: discordbot-hsr:local
    build: .
    env_file:
      - .env.runtime
      - .env.secrets
    environment:
      # Docker port publish는 container loopback에 닿지 않으므로 내부에서는 모든
      # interface에서 받고, host 쪽 publish만 127.0.0.1로 제한한다.
      WEB_ADMIN_HOST: "0.0.0.0"
    command: ["python", "-m", "module.main"]
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # host 쪽을 127.0.0.1로 못 박아 다른 interface에는 노출하지 않는다.
      # ADMIN_TOKEN이 없으면 listener 자체가 뜨지 않는다.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings:/app/settings
      - ./runtime/data:/app/runtime/data
      - ./runtime/backups:/app/runtime/backups
      # enka가 CWD(/app) 기준 .enka_py/에 게임 데이터를 캐시한다. 컨테이너를
      # 다시 만들 때마다 수십 MB를 재다운로드하지 않도록 host에 남긴다.
      - ./runtime/enka:/app/.enka_py
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: discordbot-hsr:local
    # module.backup은 Discord/OpenAI/Google 자격증명을 쓰지 않는다. 노출면을 줄인다.
    env_file:
      - .env.runtime
    command: ["python", "-m", "module.backup", "loop"]
    restart: unless-stopped
    volumes:
      # WAL DB는 읽기 전용 연결이라도 -shm/-wal을 만들 수 있어야 하므로 rw로 마운트한다.
      # 백업 코드는 온라인 backup API로 읽기만 한다.
      - ./runtime/data:/app/runtime/data
      - ./runtime/backups:/app/runtime/backups
      - ./settings:/app/settings:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
