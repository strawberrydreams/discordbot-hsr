services:
  bot:
    image: discordbot-hsr:local
    build: .
    env_file:
      - .env.runtime
      - .env.secrets
    command: ["python", "-m", "module.main"]
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # 웹 관리는 container loopback에만 bind한다. host 쪽도 127.0.0.1로 못 박아
      # 다른 interface에는 노출하지 않는다. 신뢰 경계는 봇을 host에서 직접
      # 실행할 때와 같다. ADMIN_TOKEN이 없으면 listener 자체가 뜨지 않는다.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings:/app/settings
      - ./runtime/data:/app/runtime/data
      - ./runtime/backups:/app/runtime/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: discordbot-hsr:local
    # module.backup은 Discord/OpenAI/Google 자격증명을 쓰지 않는다. 노출면을 줄인다.
    env_file:
      - .env.runtime
    command: ["python", "-m", "module.backup", "loop"]
    restart: unless-stopped
    volumes:
      # WAL DB는 읽기 전용 연결이라도 -shm/-wal을 만들 수 있어야 하므로 rw로 마운트한다.
      # 백업 코드는 온라인 backup API로 읽기만 한다.
      - ./runtime/data:/app/runtime/data
      - ./runtime/backups:/app/runtime/backups
      - ./settings:/app/settings:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
